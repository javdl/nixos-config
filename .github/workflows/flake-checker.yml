name: Flake ❄️ Checker ✅

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # l33t o'clock
    - cron: "37 13 * * *"
  workflow_dispatch:

concurrency:
  group: nix-flake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-checker:
    name: Check flake inputs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/flake-checker-action@de924abd783455e8429c858962b9e43062d19da1
        with:
          # Freshness is handled by lock-updater.yml; fail here on provenance,
          # supported-ref, and lockfile-policy violations.
          check-outdated: false
          fail-mode: true
          ignore-missing-flake-lock: false
          nixpkgs-keys: nixpkgs,nixpkgs-unstable

  flake-check:
    name: Evaluate and check every configuration
    # This is a public repository. Never run code from an untrusted fork on the
    # persistent self-hosted runner; same-repository PRs require write access.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - nixos-config
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Evaluate every flake output
        shell: bash
        run: |
          if nix flake check --all-systems --no-build --print-build-logs; then
            exit 0
          fi

          # Hermes' flake-parts module refers back to inputs.self.packages. A
          # collected lazy self-source cannot be restored by archiving the root
          # flake; directly evaluating the pinned package materializes it.
          echo "::warning::Materializing the locked Hermes package before retrying evaluation"
          # shellcheck disable=SC2016 # ${...} below is Nix interpolation.
          hermes_ref="$(
            nix eval --raw --impure --expr '
              let
                locked = (builtins.fromJSON (builtins.readFile ./flake.lock)).nodes."hermes-agent".locked;
              in
              "github:${locked.owner}/${locked.repo}/${locked.rev}"
            '
          )"
          nix eval --raw "${hermes_ref}#packages.x86_64-linux.default.drvPath" \
            --no-eval-cache --option lazy-trees false >/dev/null
          nix flake check --all-systems --no-build --no-eval-cache --print-build-logs --option lazy-trees false

      - name: Build native checks
        run: |
          nix build --print-build-logs \
            .#checks.x86_64-linux.format \
            .#checks.x86_64-linux.performance-policy
