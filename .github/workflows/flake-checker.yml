name: Flake ❄️ Checker ✅

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # l33t o'clock
    - cron: "37 13 * * *"
  workflow_dispatch:

concurrency:
  group: nix-flake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-checker:
    name: Check flake inputs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/flake-checker-action@de924abd783455e8429c858962b9e43062d19da1
        with:
          # Freshness is handled by lock-updater.yml; fail here on provenance,
          # supported-ref, and lockfile-policy violations.
          check-outdated: false
          fail-mode: true
          ignore-missing-flake-lock: false
          nixpkgs-keys: nixpkgs,nixpkgs-unstable

  flake-check:
    name: Evaluate and check every configuration
    # This is a public repository. Never run code from an untrusted fork on the
    # persistent self-hosted runner; same-repository PRs require write access.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - nixos-config
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Evaluate every flake output
        shell: bash
        run: |
          if nix flake check --all-systems --no-build --print-build-logs; then
            exit 0
          fi

          # Determinate lazy trees can occasionally retain an input source path
          # that was collected before a dependent output forces it. Retry only
          # after a real failure; ordinary evaluation keeps lazy trees enabled.
          echo "::warning::Retrying evaluation with lazy trees disabled"
          nix flake check --all-systems --no-build --print-build-logs --option lazy-trees false

      - name: Build native checks
        run: |
          nix build --print-build-logs \
            .#checks.x86_64-linux.format \
            .#checks.x86_64-linux.performance-policy
