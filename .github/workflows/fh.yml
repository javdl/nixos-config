name: Build 🏗️ and Cache ❄️
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v?[0-9]+.[0-9]+.[0-9]+*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: full

jobs:
  DeterminateCI:
    name: Determinate CI 👷
    uses: DeterminateSystems/ci/.github/workflows/workflow.yml@main
    permissions:
      id-token: "write"
      contents: "read"
    with:
      visibility: public
      # Let every leg run to completion so a failure is attributable to the leg
      # that caused it, rather than cancelling its siblings.
      fail-fast: false
      # Evaluating every flake output peaks at ~31.6 GB RSS (measured on bali,
      # 2026-07-28), which OOM-kills the 16 GB GitHub-hosted ubuntu-latest — it
      # dies mid-evaluation with a bare "runner has received a shutdown signal".
      # Send the x86_64-linux leg to bali's dedicated 62 GB self-hosted runner
      # instead (hosts/bali.nix, label "nixos-config"). The darwin and aarch64
      # legs keep the upstream defaults.
      runner-map: |
        {
          "aarch64-darwin": "macos-latest",
          "x86_64-linux": "nixos-config",
          "aarch64-linux": "ubuntu-24.04-arm"
        }
