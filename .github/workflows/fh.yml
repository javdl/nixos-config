name: Build 🏗️ and Cache ❄️
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v?[0-9]+.[0-9]+.[0-9]+*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: full

jobs:
  DeterminateCI:
    name: Determinate CI 👷
    uses: DeterminateSystems/ci/.github/workflows/workflow.yml@main
    permissions:
      id-token: "write"
      contents: "read"
    with:
      visibility: public
      # Diagnostic (2026-07-28): the x86_64-linux leg dies mid-evaluation with
      # "runner has received a shutdown signal" and no error of its own, which
      # then cancels the other two legs and hides whether they'd have passed.
      # Let every leg run to completion so the failure is attributable.
      fail-fast: false
