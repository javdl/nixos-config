# SOPS configuration for encrypted secrets
#
# To add a new host:
#   1. Get the host's SSH public key: ssh-keyscan <hostname> 2>/dev/null | grep ed25519
#   2. Convert to age: ssh-to-age -i /path/to/ssh_host_ed25519_key.pub
#   3. Add the age key to this file under 'keys'
#   4. Create secrets/<hostname>.yaml
#   5. Run: sops secrets/<hostname>.yaml
#
# To edit secrets: sops secrets/<hostname>.yaml

keys:
  # Admin keys (can decrypt all secrets)
  # Add your personal age key here:
  # - &admin_joost age1...

  # Host keys (derived from SSH host keys using ssh-to-age)
  # Run: ssh-to-age -i /etc/ssh/ssh_host_ed25519_key.pub
  - &joostclaw age17n047nq8vclhr2gja7fe8z9uv8pug49r6k6c27cxd92jgnmups2qcdte99
  # bali: personal server on the repurposed github-runner-06 box
  # (136.243.104.36). Real host age key, derived post-provision via
  # `ssh-keyscan 136.243.104.36 | grep ed25519 | ssh-to-age`.
  - &bali age1lxs7yh7qsphgdyv4ujmpysk44vdz38ykurslm6awsznfam864gwq3qtaqp
  # radon: Mac mini, family Hermes gateway. Derived from its SSH host key via
  # `ssh-to-age -i /etc/ssh/ssh_host_ed25519_key.pub` (read over SSH, 2026-10-24).
  - &radon age1up4gk2najj56dtdxsfzje30ma8vm43ma6kzkehhrd56xjl6m6f9q2zjma4

creation_rules:
  # joostclaw secrets
  - path_regex: secrets/joostclaw\.yaml$
    key_groups:
      - age:
          - *joostclaw

  # bali secrets (hermes-env), encrypted to its provisioned host age key.
  - path_regex: secrets/bali\.yaml$
    key_groups:
      - age:
          - *bali

  # radon secrets (family Hermes hermes-env). Encrypted to the host key (so
  # radon decrypts at activation) and bali (so it can be edited from there).
  - path_regex: secrets/radon\.yaml$
    key_groups:
      - age:
          - *radon
          - *bali
