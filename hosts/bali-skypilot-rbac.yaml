apiVersion: v1
kind: Namespace
metadata:
  name: skypilot
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.35
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: skypilot-api
  namespace: skypilot
---
# API access is limited to workload resources, with no RBAC write permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: skypilot-api
  namespace: skypilot
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/status", "pods/exec", "pods/portforward", "services", "secrets", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["pods/log", "events", "serviceaccounts", "resourcequotas"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: skypilot-api
  namespace: skypilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: skypilot-api
subjects:
  - kind: ServiceAccount
    name: skypilot-api
    namespace: skypilot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: skypilot-api-read
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: skypilot-api-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: skypilot-api-read
subjects:
  - kind: ServiceAccount
    name: skypilot-api
    namespace: skypilot
---
# Kubernetes fills the token at runtime; no credential is stored in git/Nix.
apiVersion: v1
kind: Secret
metadata:
  name: skypilot-api-token
  namespace: skypilot
  annotations:
    kubernetes.io/service-account.name: skypilot-api
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: skypilot-workload
  namespace: skypilot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: skypilot-workload
  namespace: skypilot
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "delete", "deletecollection"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: skypilot-workload
  namespace: skypilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: skypilot-workload
subjects:
  - kind: ServiceAccount
    name: skypilot-workload
    namespace: skypilot
